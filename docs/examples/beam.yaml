# Render with -p web for color or -p print-mono for 1-bit print.
mangacli: 1
meta: { title: Beam effects, lang: en }
book: { pageNumbers: { enabled: false } }
page: { size: [105mm, 65mm], bleed: 0, baseFrame: trim, safeArea: { inset: 0 }, color: color }
pages:
  - id: single
    panels:
      - background: "#dfebf5"
        layers:
          - effect: beam
            seed: 42
            from: [15%, 72%]
            to: [83%, 35%]
            width: [12%, 29%]
            jitter: 0.4
            color: "#123661"
  - id: volley
    panels:
      - background: "#f2e5dc"
        layers:
          - effect: beam
            seed: 42
            path: [[12%, 54%], [44%, 47%], [66%, 46%], [85%, 42%]]
            width: [4%, 9%]
            count: 3
            spread: 32deg
            edge: tone
            tone: { tone: { density: 0.48, color: "#904529" } }
            color: "#592314"
