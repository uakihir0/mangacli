# yaml-language-server: $schema=../../node_modules/mangacli/schema.json
#
# B5 判・モノクロ・右綴じの同人誌原稿の例（2 ページ）。
# 断ち切り、斜めの間白、分割木、アンチゴチの混植、ルビ・傍点、各種の吹き出し、
# 集中線・ベタフラッシュ・ウニフラッシュ・流線・縦線、トーン、描き文字、漫符、散布、
# セリフの省略記法、連結、はみ出し、コマをまたぐ吹き出しを使う（P0 と P1 の機能を含む）。
#
#   npx mangacli render docs/examples/b5-mono.yaml --profile doujin      # 入稿用（トンボ付き）
#   npx mangacli render docs/examples/b5-mono.yaml --profile web         # Web 掲載用
#   npx mangacli render docs/examples/b5-mono.yaml --profile preview --debug

mangacli: 1

meta:
  title: 放課後の約束
  author: 山田花子
  lang: ja

book:
  binding: right                     # 右綴じ（右から左へ読む。1 ページ目は左ページ）
  pageNumbers:
    position: bottom-outer

page:
  size: B5
  bleed: 3mm
  baseFrame: { size: [150mm, 220mm] }
  gutter: { col: 2.5mm, row: 5mm }
  color: mono

seed: 20261103
engine: 1                            # 見た目・レイアウトのアルゴリズムを固定する
hand:
  preset: ink

fonts:                               # カタログのフォント（必要なときに自動で取得する）
  antique: catalog:zen-antique
  gothic: catalog:zen-kaku-gothic-new@700
  mincho: catalog:shippori-mincho@500
  heavy: catalog:dela-gothic-one
  pen: catalog:klee-one              # 手書き文字は manga-basic の yomogi ではなく Klee One にする
  dialogue:                          # アンチゴチ: かなはアンチック体、漢字はゴシック体
    compose:
      - { font: antique, ranges: [kana, punct] }
      - { font: gothic }
    bold: heavy
  narration: mincho
  shout: heavy
  sfx: heavy
  hand: pen

assets:
  corridor:
    src: ./assets/bg/corridor.png
    kind: background
  classroom:
    src: ./assets/bg/classroom.png
    kind: background
  taro-normal:
    src: ./assets/taro/normal.png
    character: taro
    anchors: { mouth: [500, 535] }
    regions: { face: [285, 155, 430, 490] }
  taro-shock:
    src: ./assets/taro/shock.png
    character: taro
    anchors: { mouth: [500, 550] }
    regions: { face: [285, 155, 430, 490] }
  hanako-smile:
    src: ./assets/hanako/smile.png
    character: hanako
    anchors: { mouth: [500, 520] }
    regions: { face: [285, 155, 430, 490] }
  hanako-back:
    src: ./assets/hanako/back.png
    kind: lineart                    # 白背景の線画（乗算で重ねる）
    character: hanako

characters:
  taro:
    name: 太郎
  hanako:
    name: 花子
    balloon:
      stroke: { width: 0.22mm }      # 花子の吹き出しは少し細い線
  teacher:
    name: 先生

styles:
  small-talk:
    for: balloon
    fontSize: 11Q
    padding: [0.5em, 0.6em]

defaults:
  panel:
    border: { width: 0.5mm }
  balloon:
    fontSize: 13Q

output:
  dir: ./out
  profiles:
    doujin:
      extends: print-mono
      crop: marks

pages:
  # ── 1 ページ目 ───────────────────────────────
  - id: p1
    layout:
      rows:
        - { cols: [1], height: 1.1 }
        - { cols: [3, 2], height: 1.3, slant: 4mm }   # 右のコマが広い。下の境界は右下がり
        - { cols: [1], height: 1 }
    panels:
      # 1 コマ目: 断ち切りの導入
      - id: p1-intro
        bleed: [top, left, right]
        layers:
          - image: corridor
            focus: [0.5, 0.4]
          - effect: speed-lines
            angle: 0deg
            region: { band: { side: bottom, size: 30% } }
            thickness: [0.08mm, 0.25mm]      # モノクロでは opacity ではなく線幅で薄く見せる
          - balloon: その日の放課後——
            as: narration
            place: top-right
          - sfx: ガラッ
            at: [22%, 55%]
            fontSize: 11mm
            perChar: { rotate: [-10deg, 10deg] }

      # 2 コマ目: 花子の登場
      - id: p1-hanako
        layers:
          - tone: 10%
          - effect: uni-flash
            center: hanako1.face
          - image: hanako-smile
            id: hanako1
            size: [auto, 95%]
            at: [55%, 100%]
            anchor: bottom
          - type: scatter
            items: [{ mark: sparkle }]
            count: 6
            avoid: [{ element: hanako1, mode: alpha }]
        dialogue:
          - hanako: |
              太郎くん
              ちょっといい？
          - { who: hanako, text: 《《大事な》》話があるの, style: small-talk }

      # 3 コマ目: 太郎の反応
      - id: p1-taro
        layers:
          - image: taro-normal
            id: taro1
            size: [auto, 100%]
            at: [50%, 100%]
            anchor: bottom
            flip: x
          - mark: sweat
            at: taro1.face.top-left
            anchor: bottom-left
            offset: [2mm, -1mm]
        dialogue:
          - taro: え、｜俺《おれ》？

      # 4 コマ目: 決めゴマ（人物が上の枠からはみ出す）
      - id: p1-shock
        bleed: [bottom, left, right]
        layers:
          - effect: beta-flash
            center: taro2.face
          - image: taro-shock
            id: taro2
            size: [auto, 110%]
            at: [60%, 105%]
            anchor: bottom
            clip: { to: panel, open: [top] }
            outline: 0.8mm white
          - mark: surprise
            target: taro2
          - type: sfx
            text: ドキッ
            at: [20%, 35%]
            fontSize: 16mm
            grow: 0.12
            distort: { roughen: 0.4, warp: 0.25 }
        dialogue:
          - { who: taro, as: shout, text: "!?" }

  # ── 2 ページ目 ───────────────────────────────
  - id: p2
    layout:
      split: rows
      sizes: [2, 3]
      slant: [6mm]
      children:
        - split: cols
          sizes: [1, 1]
          children: [panel, panel]
        - panel
    panels:
      - id: p2-room
        layers:
          - image: classroom
          - type: fill
            paint: "tone-gradient(30%, 0%, 180deg)"   # 上から下へ薄くなる（角度は CSS と同じ）
        dialogue:
          - { as: narration, text: 教室には誰もいない }

      - id: p2-back
        layers:
          - image: hanako-back
            size: [auto, 90%]
            at: [50%, 100%]
            anchor: bottom
          - effect: gloom-lines
        dialogue:
          - { who: hanako, as: whisper, text: じつはね…… }

      - id: p2-think
        layers:
          - effect: focus-lines
            center: [50%, 45%]
            inner: [30%, 24%]
            background: paper
            passes:
              - { count: 140, innerJitter: 0.15, thickness: [0.2mm, 0.6mm] }
              - { count: 260, inner: [38%, 31%], thickness: [0.08mm, 0.25mm] }
          - image: taro-normal
            id: taro3
            size: [auto, 85%]
            at: [50%, 100%]
            anchor: bottom
          - type: balloon
            id: b-think
            text: |
              まさか
              告白……！？
            as: think
            who: taro
            at: [78%, 22%]
          - type: balloon
            text: いや、ないない
            as: think
            who: taro
            at: [62%, 40%]
            connect: { to: b-think, style: neck }
          - text: ※太郎の心の声
            font: hand
            lettering: hand
            fontSize: 8Q
            writing: horizontal
            place: bottom-left
            rotate: -4deg
        dialogue:
          - { who: teacher, as: offscreen, from: right, text: おーい まだ残ってるのか！ }

    layers:
      # コマをまたぐ吹き出し（ページ座標）
      - type: balloon
        text: あっ
        who: hanako
        at: [30%, 41%]
        tail: { direction: 120deg, length: 7mm }
