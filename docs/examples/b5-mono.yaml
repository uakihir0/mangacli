# yaml-language-server: $schema=../../node_modules/mangacli/schema.json
# B5 判モノクロ: 屋上の対決。右から左、上から下へ読む。
# npx mangacli render docs/examples/b5-mono.yaml --profile doujin

mangacli: 1
meta: { title: 屋上の決闘, lang: ja }
book: { binding: right }
page:
  size: B5
  baseFrame: { size: [150mm, 220mm] }
  bleed: 3mm
  color: mono
seed: 20261103

fonts:
  antique: catalog:zen-antique
  gothic: catalog:zen-kaku-gothic-new@700
  heavy: catalog:dela-gothic-one
  dialogue:
    compose:
      - { font: antique, ranges: [kana, punct] }
      - { font: gothic }
    bold: heavy

assets:
  roof: ./assets/rooftop/p1-1.jpg
  hayato: ./assets/rooftop/p1-2.jpg
  entrance: ./assets/rooftop/p1-3.jpg
  resolve: ./assets/rooftop/p2-3.jpg
  dash: ./assets/rooftop/p2-4.jpg
  farewell: ./assets/rooftop/p4-3.jpg

characters:
  hayato: { name: 霧島ハヤト }
  mio: { name: 鷹野ミオ }

output:
  dir: ./out
  profiles:
    doujin:
      extends: print-mono
      crop: marks

pages:
  - id: arrival
    layout:
      rows:
        - { cols: [1], height: 0.85 }
        - { cols: [1, 2], height: 1.45, colSlant: [8mm] }
    panels:
      - layers:
          - { image: roof, focus: [0.5, 0.58] }
          - { balloon: "放課後。\n屋上。", as: narration, at: [84%, 28%] }
      - layers:
          - { image: hayato, focus: [0.46, 0.34] }
          - balloon: "……来たか。"
            who: hayato
            as: think
            fontSize: 14Q
            at: [68%, 56%]
            tail: { to: [51%, 40%] }
      - bleed: [left, bottom]
        layers:
          - { image: entrance, focus: [0.5, 0.38] }
          - { sfx: バンッ, font: heavy, at: [75%, 67%], fontSize: 16mm, rotate: 10deg }
        dialogue:
          - { mio: "見つけた！\n｜霧島《きりしま》ハヤト!!", as: shout, fontScale: 1.05, at: [24%, 28%], tail: { to: [47%, 40%] } }

  - id: challenge
    layout:
      split: rows
      sizes: [1, 1.4, 2.4]
      slant: [0, -7mm]
      children: [panel, panel, panel]
    panels:
      - layers:
          - { image: farewell, focus: [0.5, 0.3] }
        dialogue:
          - { hayato: "まだやるのか？", as: whisper, at: [20%, 44%], tail: { to: [53%, 39%] } }
      - layers:
          - { image: resolve, focus: [0.5, 0.41] }
        dialogue:
          - { mio: "今日こそ\n私が勝つ！", at: [80%, 49%], tail: { to: [47%, 48%] } }
      - bleed: [left, right, bottom]
        layers:
          - { image: dash, focus: [0.47, 0.38] }
          - { sfx: ダッ, font: heavy, at: [81%, 41%], fontSize: 22mm, grow: -0.12, rotate: -9deg }
