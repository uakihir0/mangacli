# yaml-language-server: $schema=../../node_modules/mangacli/schema.json
#
# 最小の例: B5 判・モノクロ・右綴じ・縦書き・手描き風（ink）の既定値で 1 ページを出力する。
# 使う機能はすべて P0。
#
#   npx mangacli render docs/examples/minimal.yaml --profile preview

mangacli: 1

# fonts を省略すると、既定のフォントセット manga-basic（アンチゴチ・明朝体など）を使う。
# 手元になければ初回のレンダリング時に自動でダウンロードする（mangacli fonts install で事前に取得してもよい）。

assets:
  roof: ./assets/rooftop/p1-1.jpg
  entrance: ./assets/rooftop/p1-3.jpg

pages:
  - layout:
      rows:
        - { cols: [1], height: 1 }
        - { cols: [1], height: 1.75 }
    panels:
      - layers:
          - image: roof
          - { balloon: "放課後。\n屋上。", as: narration, at: [85%, 32%] }
      - layers:
          - { image: entrance, focus: [0.5, 0.39] }
          - { balloon: "見つけた！", at: [24%, 27%], tail: { to: [46%, 46%] } }
