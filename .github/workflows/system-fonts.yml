name: System fonts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  noto-cjk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-noto-cjk
      - run: npm ci
      - run: npm test -- test/system-fonts.test.ts
        env:
          MANGACLI_TEST_SYSTEM_FONTS: '1'
